name: CI

# Pull requests, and main after a merge. Not every branch push, or each PR runs twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One run per PR: a new push cancels the older one. Runs on main are never grouped, so
  # every merged commit gets its own run and Render can deploy it (docs/specs/ci-speedups.md).
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Fail fast instead of GitHub's 6-hour default if a step hangs.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Throwaway CI database and key; DEBUG stays off, as on Render.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pc_flipper_toolkit
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Includes the type check (tsc -b).
      - run: npm run build

  # One browser walk-through of the main flow, against Django and Vite on a throwaway DB.
  e2e:
    runs-on: ubuntu-latest
    # About 2 minutes normally; 11 at worst on 2026-11-06, when installing the browser was slow.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          # The unit tests make their own test_ database; a real server needs this one.
          POSTGRES_DB: pc_flipper_toolkit
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pc_flipper_toolkit
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The Playwright config starts Django from backend/.venv, as in local development.
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Chromium is cached under the exact Playwright version; a cache saved on main is
      # shared with every PR. The system packages still install each time.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      # Also on a pass, so a run that only passed on its retry (flaky) can be looked at.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
