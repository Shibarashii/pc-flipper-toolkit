<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vercel serves this for any URL that isn't one of the app's routes (vercel.json), with
         status 404. Plain HTML: no React here, and no inline styles (the CSP forbids them). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · PC Flipper Toolkit</title>
    <link rel="icon" type="image/png" href="/logo-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <header>
      <a href="/" class="home">
        <img src="/logo-light.png" alt="" class="logo-light" width="28" height="28" />
        <img src="/logo-dark.png" alt="" class="logo-dark" width="28" height="28" />
        PC Flipper Toolkit
      </a>
    </header>
    <main>
      <h1>Page not found</h1>
      <p>There’s nothing at this address. Check the link, or start from the home page.</p>
      <a href="/" class="button">Go to the home page</a>
    </main>
  </body>
</html>
