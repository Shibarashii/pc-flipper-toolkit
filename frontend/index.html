<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google's sign-in button: its script and frame load from here. -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap"
      rel="stylesheet"
    />
    <title>PC Flipper Toolkit</title>
    <!-- Search snippet and shared-link card (docs/specs/share-card.md). Previewers don't run
         JavaScript, so every URL gets these; URLs must be absolute. -->
    <meta
      name="description"
      content="Track the profit on every PC you flip: parts, extra costs, selling price and true profit. Try the demo, no sign-up needed."
    />
    <link rel="canonical" href="https://pc-flipper-toolkit.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PC Flipper Toolkit" />
    <meta property="og:title" content="PC Flipper Toolkit" />
    <meta
      property="og:description"
      content="Track the profit on every PC you flip: parts, extra costs, selling price and true profit. Try the demo, no sign-up needed."
    />
    <meta property="og:url" content="https://pc-flipper-toolkit.vercel.app/" />
    <meta
      property="og:image"
      content="https://pc-flipper-toolkit.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The builds list: each PC build with its status, cost, selling price and profit"
    />
    <script>
      // The theme picked with the header button, applied before first paint (no flash).
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
