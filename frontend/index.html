<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab follows the browser's theme, not the header button. -->
    <link
      rel="icon"
      type="image/png"
      href="/logo-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/logo-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google's sign-in button: its script and frame load from here. -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap"
      rel="stylesheet"
    />
    <title>PC Flipper Toolkit</title>
    <!-- Search snippet and shared-link card (specs/share-card.md). Previewers don't run
         JavaScript, so every URL gets these; URLs must be absolute. -->
    <meta
      name="description"
      content="For people who flip PCs. Log each part, bundle and extra cost, and the app does the math. Try the demo, no sign-up needed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PC Flipper Toolkit" />
    <meta
      property="og:title"
      content="PC Flipper Toolkit · Track your profit on every PC you flip"
    />
    <meta
      property="og:description"
      content="For people who flip PCs. Log each part, bundle and extra cost, and the app does the math. Try the demo, no sign-up needed."
    />
    <meta property="og:url" content="https://pc-flipper-toolkit.vercel.app/" />
    <meta
      property="og:image"
      content="https://pc-flipper-toolkit.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The landing page: “Track your profit on every PC you flip”, beside a sold build’s parts in its case and +₱4,200.00 profit"
    />
    <script>
      // The theme picked with the header button, applied before first paint (no flash).
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <!-- The site's name in Google's results. Data, not a script: the CSP needs no hash. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PC Flipper Toolkit",
        "url": "https://pc-flipper-toolkit.vercel.app/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
